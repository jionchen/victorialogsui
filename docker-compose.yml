version: '3.8'

services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.50.0
    ports:
      - "9428:9428"
    volumes:
      - vlogs-data:/vlogs-data
    command:
      - "-storageDataPath=/vlogs-data"
      - "-retentionPeriod=30d"

  vlogs-ui:
    image: victorialogsui:v2.0.0
    ports:
      - "8080:80"
    depends_on:
      - victorialogs

volumes:
  vlogs-data:
