server {
    listen 80;
    server_name _;

    # Frontend static files
    location /vlogs-ui/ {
        alias /usr/share/nginx/html/vlogs-ui/;
        try_files $uri $uri/ /vlogs-ui/index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # API proxy to VictoriaLogs (dynamic routing via header)
    location /api/ {
        # Default backend
        set $backend "http://172.19.0.176:19428";

        # Dynamic routing: read target from X-Proxy-Target header
        # If the header is set, use it as the backend
        if ($http_x_proxy_target != '') {
            set $backend $http_x_proxy_target;
        }

        # Support dynamic backend resolution (Nginx requires a resolver for domain names if used, otherwise IP is fine)
        
        # Rewrite the URI to strip /api prefix
        rewrite ^/api/(.*) /$1 break;

        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Remove custom header before forwarding
        proxy_set_header X-Proxy-Target "";

        # Support streaming responses (Live Tailing)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Redirect root to vlogs-ui
    location = / {
        return 302 /vlogs-ui/;
    }
}
