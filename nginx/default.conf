# 服务端代理目标白名单: 仅下列后端地址允许被转发, 其余一律返回 403。
# 维护位置: 部署方在此 map 中按需追加允许的后端地址(与 docker-compose 后端服务名一致)。
map $http_x_proxy_target $backend {
    default                       "";                  # 不在白名单 => 空, 后续 403
    "http://victorialogs:9428"    $http_x_proxy_target; # 允许的后端(与 docker-compose 后端服务名一致)
    # 部署方在此按需追加其它允许的后端地址
}

server {
    listen 80;
    server_name _;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /vlogs-ui/ {
        alias /usr/share/nginx/html/vlogs-ui/;
        try_files $uri $uri/ /vlogs-ui/index.html;
        
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        resolver 127.0.0.11 valid=30s;

        if ($backend = "") {
            return 403;
        }

        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Target "";

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location = / {
        return 302 /vlogs-ui/;
    }
}
