map $http_x_proxy_target $backend {
    ""      http://invalid-target:9428;
    default $http_x_proxy_target;
}

server {
    listen 80;
    server_name _;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /vlogs-ui/ {
        alias /usr/share/nginx/html/vlogs-ui/;
        try_files $uri $uri/ /vlogs-ui/index.html;
        
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        resolver 127.0.0.11 valid=30s;

        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Proxy-Target "";

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location = / {
        return 302 /vlogs-ui/;
    }
}
